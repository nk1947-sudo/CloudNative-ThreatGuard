apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tp-003-reconnaissance-binaries
  labels:
    app.kubernetes.io/name: cloudnative-threatguard
    app.kubernetes.io/component: runtime-ebpf
    security.threatguard.io/rule: RUNTIME-003
    security.threatguard.io/mitre: T1082
spec:
  kprobes:
    - call: "sys_enter_execve"
      syscall: true
      args:
        - index: 0
          type: "string" # Binary path
        - index: 1
          type: "string" # Arguments
      selectors:
        - matchNamespaces:
            - "threatguard"
          matchArgs:
            - index: 0
              operator: "In"
              values:
                - "/usr/bin/whoami"
                - "/bin/whoami"
                - "/usr/bin/id"
                - "/bin/id"
                - "/usr/bin/uname"
                - "/bin/uname"
                - "/bin/ps"
                - "/usr/bin/ps"
                - "/usr/bin/env"
                - "/bin/env"
          matchActions:
            - action: Post
              rateLimit: "10m"
