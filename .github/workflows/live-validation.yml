name: "Live eBPF Validation"

# Separate, manually triggered gate that runs the real cluster workflow
# against real Tetragon events. It is deliberately not part of the default CI:
# it needs a runner whose kernel supports the Tetragon sensors (BTF, host
# procfs) and enough privilege to run KIND.
#
# An unsupported runner must end BLOCKED (exit 2) and fail this job. It never
# substitutes the demo fixtures: that would report simulated evidence as live.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: "Live cluster validation"
    runs-on: [self-hosted, linux, ebpf]
    timeout-minutes: 45
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Package"
        run: pip install -e ".[dev]"

      - name: "Provision cluster and security stack"
        run: |
          make cluster-up
          make install-security

      - name: "Live validation (exit 0 pass, 1 fail, 2 blocked)"
        run: bash scripts/run-security-validation.sh --mode live

      - name: "Repeat run (repeatability)"
        run: bash scripts/run-security-validation.sh --mode live

      - name: "Network isolation"
        run: bash scripts/test-network-policy.sh

      - name: "Upload evidence manifest and sanitized artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-validation-${{ github.run_id }}
          path: |
            artifacts/security-report.json
            artifacts/admission/admission-results.json
            artifacts/runtime/run-manifest.json
            artifacts/runtime/runtime-events.json
            artifacts/runtime/scenario-results.tsv
            artifacts/network/network-policy-results.json
          if-no-files-found: warn
