name: "Security Scan"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security-analysis:
    name: "Linting & Vulnerability Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "ShellCheck Scripts"
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "scripts"
          severity: "warning"

      - name: "Hadolint Dockerfile"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "app/secure-web-app/Dockerfile"
          failure-threshold: "error"
          ignore: "DL3008,DL3013"

      - name: "Trivy Vulnerability & Secret Scan"
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: "Setup Python"
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Package"
        if: always()
        run: pip install -e .

      - name: "Generate SBOM"
        if: always()
        run: bash scripts/generate-sbom.sh

      - name: "Upload SBOM"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-sbom
          path: artifacts/reports/sample-app-sbom.json
