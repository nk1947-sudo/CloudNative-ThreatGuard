# KIND cluster without the default CNI, for installing Calico so NetworkPolicy
# is enforced for pod and host-destined traffic. Used by:
#   CNI=calico bash scripts/setup-cluster.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
- role: control-plane
  image: kindest/node:v1.30.0
  extraMounts:
  - hostPath: /sys/kernel/debug
    containerPath: /sys/kernel/debug
  - hostPath: /sys/fs/bpf
    containerPath: /sys/fs/bpf
  - hostPath: /lib/modules
    containerPath: /lib/modules
    readOnly: true
