apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8shostfilesystem
  annotations:
    description: "Prohibits mounting dangerous host filesystem paths and socket files."
spec:
  crd:
    spec:
      names:
        kind: K8sHostFilesystem
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedPrefixes:
              type: array
              items:
                type: string
            prohibitedPaths:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8shostfilesystem

        default_prohibited := [
            "/",
            "/var/run/docker.sock",
            "/run/containerd/containerd.sock",
            "/var/run/crio/crio.sock",
            "/etc",
            "/etc/shadow",
            "/etc/kubernetes",
            "/root",
            "/proc",
            "/sys"
        ]

        get_prohibited_paths = paths {
            configured := object.get(input.parameters, "prohibitedPaths", [])
            count(configured) > 0
            paths := configured
        } else = paths {
            paths := default_prohibited
        }

        has_dangerous_hostpath(volume, prohibited) {
            path := volume.hostPath.path
            prohibited_path := prohibited[_]
            path == prohibited_path
        }

        has_dangerous_hostpath(volume, prohibited) {
            path := volume.hostPath.path
            prohibited_path := prohibited[_]
            startswith(path, concat("", [prohibited_path, "/"]))
        }

        violation[{"msg": msg}] {
            volumes := input.review.object.spec.volumes
            volume := volumes[_]
            volume.hostPath
            prohibited := get_prohibited_paths
            has_dangerous_hostpath(volume, prohibited)
            msg := sprintf("Volume '%v' in pod '%v' violates policy [SEC-ADM-003]: mounting hostPath '%v' is strictly prohibited as it exposes sensitive node files or container runtime control sockets.", [volume.name, input.review.object.metadata.name, volume.hostPath.path])
        }
