apiVersion: v1
kind: Pod
metadata:
  name: insecure-05-allow-priv-escalation
  namespace: threatguard
  labels:
    test: admission-negative-05
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: cgr.dev/chainguard/python:latest
      securityContext:
        privileged: false
        allowPrivilegeEscalation: true # VIOLATION: allowPrivilegeEscalation must be false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
