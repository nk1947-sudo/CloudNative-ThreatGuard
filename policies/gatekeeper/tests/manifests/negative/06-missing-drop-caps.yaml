apiVersion: v1
kind: Pod
metadata:
  name: insecure-06-missing-drop-caps
  namespace: threatguard
  labels:
    test: admission-negative-06
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: cgr.dev/chainguard/python:latest
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          add:
            - SYS_ADMIN # VIOLATION: prohibited capability and missing drop ALL
        seccompProfile:
          type: RuntimeDefault
