apiVersion: v1
kind: Pod
metadata:
  name: insecure-04-root-user-pod
  namespace: threatguard
  labels:
    test: admission-negative-04
spec:
  securityContext:
    runAsUser: 0 # VIOLATION: root user
  containers:
    - name: web
      image: cgr.dev/chainguard/python:latest
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
