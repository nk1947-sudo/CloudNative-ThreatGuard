apiVersion: v1
kind: Pod
metadata:
  name: insecure-01-privileged-pod
  namespace: threatguard
  labels:
    test: admission-negative-01
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: cgr.dev/chainguard/python:latest
      securityContext:
        privileged: true # VIOLATION: privileged must be false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
