services:
  exporter:
    image: python:3.12-slim
    container_name: threatguard-exporter
    working_dir: /workspace
    command: sh -c "pip install --no-cache-dir -e . -q && python -m cloudnative_threatguard.observability.metrics_exporter"
    user: "10001:10001"
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - .:/workspace:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: threatguard-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    depends_on:
      - exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: threatguard-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
