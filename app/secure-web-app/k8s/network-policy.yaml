apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: threatguard-app-netpol
  namespace: threatguard
  labels:
    app.kubernetes.io/name: cloudnative-threatguard
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: threatguard-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic on application port only from within the namespace or designated test pods
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution to CoreDNS in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
