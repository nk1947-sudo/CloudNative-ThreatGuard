apiVersion: v1
kind: Pod
metadata:
  name: insecure-08-writable-rootfs
  namespace: threatguard
  labels:
    test: admission-negative-08
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: cgr.dev/chainguard/python:latest
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false # VIOLATION: readOnlyRootFilesystem must be true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
