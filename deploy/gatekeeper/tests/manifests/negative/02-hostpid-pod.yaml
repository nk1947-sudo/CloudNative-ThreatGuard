apiVersion: v1
kind: Pod
metadata:
  name: insecure-02-hostpid-pod
  namespace: threatguard
  labels:
    test: admission-negative-02
spec:
  hostPID: true # VIOLATION: hostPID must be false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: cgr.dev/chainguard/python:latest
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
