# Enables NetworkPolicy enforcement on a KIND cluster that was created with an
# older kindnet. Newer kindnetd releases include a policy controller but need
# permission to watch pods, namespaces and NetworkPolicies.
#
# Apply, then roll the DaemonSet to the matching image:
#   kubectl apply -f deploy/kubernetes/kindnet-netpol.yaml
#   kubectl set image ds/kindnet kindnet-cni=docker.io/kindest/kindnetd:v20250512-df8de77b -n kube-system
#
# Verify with: make network-test
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kindnet-netpol
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kindnet-netpol
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kindnet-netpol
subjects:
  - kind: ServiceAccount
    name: kindnet
    namespace: kube-system
